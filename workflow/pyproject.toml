[project]
name = "mistral-workflow"
version = "0.1.0"
description = "Orchestrates a team of persistent Mistral Vibe agent sessions with a shared blackboard and live visualization"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "pydantic>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "mcp>=1.20",
]

[project.scripts]
mistral = "mistral_workflow.cli:main"
mistral-workflow-api = "mistral_workflow.blackboard.api:main"
mistral-workflow-mcp = "mistral_workflow.blackboard.mcp_server:main"
mistral-workflow-guard-push = "mistral_workflow.hooks.guard_push:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mistral_workflow"]

[tool.hatch.build]
include = ["mistral_workflow/templates/**"]
