<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        .section {
            display: none;
            margin-bottom: 20px;
        }
        .section.active {
            display: block;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
        }
        input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }
        button {
            padding: 8px 15px;
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        .todo-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border: 1px solid #ddd;
            margin-bottom: 10px;
        }
        .todo-item.completed {
            text-decoration: line-through;
            color: #888;
        }
        .todo-actions {
            display: flex;
            gap: 5px;
        }
        .error {
            color: red;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div id="login-section" class="section active">
        <h1>Login</h1>
        <div id="auth-error" class="error"></div>
        <div class="form-group">
            <label for="username">Username:</label>
            <input type="text" id="username" required>
        </div>
        <div class="form-group">
            <label for="password">Password:</label>
            <input type="password" id="password" required>
        </div>
        <button id="login-btn">Login</button>
        <button id="register-btn">Register</button>
    </div>

    <div id="todo-section" class="section">
        <h1>Todos</h1>
        <div id="todo-error" class="error"></div>
        <div class="form-group">
            <label for="new-todo">New Todo:</label>
            <input type="text" id="new-todo" required>
        </div>
        <button id="add-todo-btn">Add Todo</button>
        <button id="logout-btn">Logout</button>
        <div id="todo-list"></div>
    </div>

    <script>
        // Base API URL
        const API_BASE = 'http://localhost:5000';

        // DOM elements
        const loginSection = document.getElementById('login-section');
        const todoSection = document.getElementById('todo-section');
        const authError = document.getElementById('auth-error');
        const todoError = document.getElementById('todo-error');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const loginBtn = document.getElementById('login-btn');
        const registerBtn = document.getElementById('register-btn');
        const newTodoInput = document.getElementById('new-todo');
        const addTodoBtn = document.getElementById('add-todo-btn');
        const logoutBtn = document.getElementById('logout-btn');
        const todoList = document.getElementById('todo-list');

        // Event listeners
        loginBtn.addEventListener('click', login);
        registerBtn.addEventListener('click', register);
        addTodoBtn.addEventListener('click', addTodo);
        logoutBtn.addEventListener('click', logout);

        // Check authentication on page load
        document.addEventListener('DOMContentLoaded', checkAuth);

        // Authentication functions
        async function checkAuth() {
            const token = localStorage.getItem('token');
            if (token) {
                try {
                    const response = await fetch(`${API_BASE}/todos`, {
                        headers: {
                            'Authorization': `Bearer ${token}`
                        }
                    });
                    
                    if (response.ok) {
                        showTodoSection();
                        await fetchTodos();
                    } else {
                        localStorage.removeItem('token');
                        showLoginSection();
                    }
                } catch (error) {
                    console.error('Auth check failed:', error);
                    localStorage.removeItem('token');
                    showLoginSection();
                }
            } else {
                showLoginSection();
            }
        }

        async function login() {
            const username = usernameInput.value.trim();
            const password = passwordInput.value.trim();
            
            if (!username || !password) {
                showAuthError('Username and password are required');
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    localStorage.setItem('token', data.token);
                    showTodoSection();
                    await fetchTodos();
                    clearAuthError();
                } else {
                    showAuthError(data.error || 'Login failed');
                }
            } catch (error) {
                showAuthError('Network error: ' + error.message);
            }
        }

        async function register() {
            const username = usernameInput.value.trim();
            const password = passwordInput.value.trim();
            
            if (!username || !password) {
                showAuthError('Username and password are required');
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE}/auth/register`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    showAuthError('Registration successful! Please login.');
                } else {
                    showAuthError(data.error || 'Registration failed');
                }
            } catch (error) {
                showAuthError('Network error: ' + error.message);
            }
        }

        function logout() {
            localStorage.removeItem('token');
            showLoginSection();
            clearTodoError();
        }

        // Todo functions
        async function fetchTodos() {
            const token = localStorage.getItem('token');
            if (!token) return;
            
            try {
                const response = await fetch(`${API_BASE}/todos`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                if (response.ok) {
                    const data = await response.json();
                    renderTodos(data.todos);
                    clearTodoError();
                } else {
                    const errorData = await response.json();
                    showTodoError(errorData.error || 'Failed to fetch todos');
                }
            } catch (error) {
                showTodoError('Network error: ' + error.message);
            }
        }

        async function addTodo() {
            const title = newTodoInput.value.trim();
            if (!title) {
                showTodoError('Title is required');
                return;
            }
            
            const token = localStorage.getItem('token');
            if (!token) return;
            
            try {
                const response = await fetch(`${API_BASE}/todos`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ title })
                });
                
                if (response.ok) {
                    newTodoInput.value = '';
                    await fetchTodos();
                    clearTodoError();
                } else {
                    const errorData = await response.json();
                    showTodoError(errorData.error || 'Failed to add todo');
                }
            } catch (error) {
                showTodoError('Network error: ' + error.message);
            }
        }

        async function updateTodo(id, completed) {
            const token = localStorage.getItem('token');
            if (!token) return;
            
            try {
                const response = await fetch(`${API_BASE}/todos/${id}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ completed })
                });
                
                if (response.ok) {
                    await fetchTodos();
                } else {
                    const errorData = await response.json();
                    showTodoError(errorData.error || 'Failed to update todo');
                }
            } catch (error) {
                showTodoError('Network error: ' + error.message);
            }
        }

        async function deleteTodo(id) {
            const token = localStorage.getItem('token');
            if (!token) return;
            
            try {
                const response = await fetch(`${API_BASE}/todos/${id}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                if (response.ok) {
                    await fetchTodos();
                } else {
                    const errorData = await response.json();
                    showTodoError(errorData.error || 'Failed to delete todo');
                }
            } catch (error) {
                showTodoError('Network error: ' + error.message);
            }
        }

        function renderTodos(todos) {
            todoList.innerHTML = '';
            
            if (!todos || todos.length === 0) {
                todoList.innerHTML = '<p>No todos yet. Add one above!</p>';
                return;
            }
            
            todos.forEach(todo => {
                const todoElement = document.createElement('div');
                todoElement.className = `todo-item ${todo.completed ? 'completed' : ''}`;
                todoElement.innerHTML = `
                    <span>${todo.title}</span>
                    <div class="todo-actions">
                        <button onclick="updateTodo('${todo.id}', ${!todo.completed})">
                            ${todo.completed ? 'Undo' : 'Complete'}
                        </button>
                        <button onclick="deleteTodo('${todo.id}')">Delete</button>
                    </div>
                `;
                todoList.appendChild(todoElement);
            });
        }

        // UI helpers
        function showLoginSection() {
            loginSection.classList.add('active');
            todoSection.classList.remove('active');
        }

        function showTodoSection() {
            loginSection.classList.remove('active');
            todoSection.classList.add('active');
        }

        function showAuthError(message) {
            authError.textContent = message;
        }

        function clearAuthError() {
            authError.textContent = '';
        }

        function showTodoError(message) {
            todoError.textContent = message;
        }

        function clearTodoError() {
            todoError.textContent = '';
        }
    </script>
</body>
</html>
